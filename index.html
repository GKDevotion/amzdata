    <!-- Structured Data: JSON-LD (SoftwareApplication) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "description": "Comprehensive Amazon product extraction tool for scraping technical specifications, pricing, verified customer reviews, and downloading Full HD 1500px images as ZIP archives.",
      "image": "/amzdata_logo.jpg",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Dynamic Amazon URL Input GUI for any product link or ASIN",
        "1-Click Download of all product images as Full HD 1500px ZIP archive",
        "Extracts current price, list price MRP, and discount percentages",
        "Parses technical specifications tables and bullet point features",
        "Customer reviews extraction with star ratings and sentiment",

    <!-- Structured Data: JSON-LD (FAQPage for AEO - Answer Engine Optimization) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How to scrape Amazon product details and pricing using AmzData?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Paste any dynamic Amazon product link (e.g., https://www.amazon.in/dp/B0792G6PF9) into the AmzData input bar and click 'Scrape Product'. AmzData automatically parses the product title, brand, technical specifications, current price, MRP, discount percentage, and customer reviews."
          }
        },
        {
          "@type": "Question",
          "name": "How to download all Amazon product images in Full HD as a ZIP file?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Once an Amazon product is loaded in AmzData, click the '1-Click Download All as ZIP' button in the Full HD Images tab. AmzData converts all thumbnail and medium resolution CDN tokens into master uncompressed Full HD 1500x1500px images and packages them into a single .zip file."
          }
        },
        {
          "@type": "Question",
          "name": "How does the Python script use Selenium and BeautifulSoup to scrape Amazon?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The included amzdata_scraper.py script initializes a Selenium Chrome WebDriver with anti-detection headers, navigates to the dynamic URL, scrolls to trigger lazy-loaded widgets, hands the DOM to BeautifulSoup4 for parsing specs and reviews, and downloads Full HD images into a ZIP archive using the requests and zipfile libraries."
          }
        },
        {
          "@type": "Question",
          "name": "How do I flush old data and start a fresh scraping session?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Click the 'Flush Data & Reset' button in the header or beside the URL input. This purges all previously extracted attributes, cached image blobs, and DOM elements, restoring a clean workspace for the next Amazon link."
          }
        }
      ]
    }
    </script>
